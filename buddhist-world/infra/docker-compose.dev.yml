
# Buddhist World - Local Development Only
# Production deployment is handled separately in Phase 11.

services:
  postgres:
    image: postgres:16-alpine
    container_name: buddhist-world-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buddhist_world

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d buddhist_world
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: buddhist-world-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
    name: buddhist-world-pgdata
