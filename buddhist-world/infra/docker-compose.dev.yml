# Chỉ dùng cho phát triển cục bộ (Postgres + Redis). Production: Phase 11.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bw
      POSTGRES_PASSWORD: bw_dev_password
      POSTGRES_DB: buddhist_world
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bw -d buddhist_world"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
