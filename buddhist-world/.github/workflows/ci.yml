name: Buddhist World CI

on:
  push:
    branches:
      - main
      - feature/phase1-foundation-hardening
      - fix/runtime-stability
  pull_request:
    branches:
      - main
      - feature/phase1-foundation-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buddhist_world_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buddhist_world_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: buddhist-world
    env:
      BW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/buddhist_world_test
      BW_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          package_json_file: buddhist-world/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: buddhist-world/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL + Redis integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build
