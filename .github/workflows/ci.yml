name: Buddhist World CI

on:
  push:
    branches: ["main", "feature/**", "fix/**"]
    paths:
      - "buddhist-world/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "buddhist-world/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buddhist-world-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bw
          POSTGRES_PASSWORD: bw_dev_password
          POSTGRES_DB: buddhist_world_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bw -d buddhist_world_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./buddhist-world
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: PostgreSQL + Redis integration tests
        env:
          BW_TEST_DATABASE_URL: postgres://bw:bw_dev_password@127.0.0.1:5432/buddhist_world_test
          BW_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: pnpm --filter @bw/server test:integration
      - name: GLB asset validation
        run: pnpm validate:glb -- apps/web/public/assets --allow-empty
      - name: Production builds
        run: pnpm build
